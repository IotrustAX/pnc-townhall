<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>샘플 발표자료</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; color: #fff;
    font-family: "Malgun Gothic", sans-serif; display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  h1 { font-size: 48px; margin: 0 0 16px; opacity: 0; transform: translateY(20px);
    animation: fadeUp 0.8s ease-out forwards; }
  p { font-size: 20px; color: #9aa; opacity: 0; animation: fadeUp 0.8s ease-out 0.3s forwards; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #4fd1c5;
    margin-top: 24px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.4; } }
</style>
</head>
<body>
  <div class="box">
    <h1>이 애니메이션이 보인다면 성공입니다</h1>
    <p>이 파일을 실제 연사 발표자료(HTML)로 교체하면 됩니다.</p>
    <div class="dot"></div>
  </div>
</body>
</html>
